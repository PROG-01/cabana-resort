<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabana Resort</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Cabana Resort Booking System</h1>

    <div id="map"></div>

    <div id="bookingModal" class="modal hidden">

    <div class="modal-content">

        <h2>Book Cabana</h2>

        <label for="roomInput">Room Number</label>
        <input id="roomInput" type="text">

        <label for="guestInput">Guest Name</label>
        <input id="guestInput" type="text">

        <div class="buttons">
            <button id="bookBtn">Book</button>
            <button id="cancelBtn">Cancel</button>
        </div>

    </div>

</div>

<div id="notification" class="notification hidden"></div>
    <script src="script.js"></script>
</body>
</html>
